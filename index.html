<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#0d0b09">

    <title>Julie & Loïc — Répondez à l'appel</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Crimson+Text:wght@400;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>


<body>

<div class="app">


    <!-- =====================================================
         ACCUEIL
    ====================================================== -->

    <main id="intro" class="screen active">

        <section class="parchment">

            <div class="safe-zone intro-layout">

                <div class="intro-spacer"></div>


                <section class="intro-content">

                   <h1>
    RÉPONDEZ
    <br>
    À L'APPEL
</h1>


<div class="intro-date">

    <span class="intro-date-main">
        19 · 06 · 2027
    </span>

    <span class="intro-date-place">
        ◆ MARESVILLE ◆
    </span>

</div>


<div class="divider">
    <span></span>
    <i>◆</i>
    <span></span>
</div>


<p class="intro-copy">
    Julie & Loïc vous convient
    <br>
    à célébrer leur union
    <br>
    lors d'une soirée mémorable !
</p>


                 <div class="attendance-grid">

    <button
        class="attendance-image-button"
        type="button"
        onclick="chooseAttendance('oui')"
        aria-label="Avec joie"
    >
        <img
            src="avec-joie.png"
            alt="Avec joie"
        >
    </button>

    <button
        class="attendance-image-button"
        type="button"
        onclick="chooseAttendance('non')"
        aria-label="Hélas"
    >
        <img
            src="helas.png"
            alt="Hélas"
        >
    </button>

</div>

        </section>

    </main>



    <!-- =====================================================
         QUESTIONNAIRE
    ====================================================== -->

    <main id="questionnaire" class="screen">

        <section class="parchment">

            <div class="safe-zone questionnaire-layout">

                <div class="logo-clearance"></div>


                <section
                    id="question-container"
                    class="question-stage"
                ></section>


                <footer class="question-footer">

                    <div class="progress-track">

                        <div
                            id="progress-bar"
                            class="progress-bar"
                        ></div>

                    </div>


                    <div class="navigation">

                        <button
                            id="previous-button"
                            type="button"
                            class="nav-button previous"
                            onclick="previousQuestion()"
                        >
                            ← RETOUR
                        </button>


                        <button
                            id="next-button"
                            type="button"
                            class="nav-button next"
                            onclick="nextQuestion()"
                        >
                            CONTINUER →
                        </button>

                    </div>

                </footer>

            </div>

        </section>

    </main>



    <!-- =====================================================
         CONFIRMATION
    ====================================================== -->

    <main id="success" class="screen">

        <section class="parchment">

            <div class="safe-zone success-layout">

                <div class="logo-clearance"></div>


                <div
                    id="success-content"
                    class="success-content"
                ></div>

            </div>

        </section>

    </main>


</div>


<script src="script.js" defer></script>

</body>

</html>
